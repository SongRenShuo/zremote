name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# 发行轮并发纪律（参考 build-plugin.yml 的 release/publish 分组）：
# 发行不可取消、不可与另一轮并发覆盖同一 tag 的 Release 资产，故 cancel-in-progress: false。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # 验证腿：analyze + test，与 CI 同口径。
  # 为什么不删（apk 旧版会跑这两步，看着像重复劳动）：tag 可能指向未被 main 的 CI 覆盖的提交，
  # 且本轮以 verify 通过为发布前提——未过验证不建 Release，验证强度不降。
  # 为什么也不挡构建：verify 与 apk/ipa 并行，不在关键路径上（apk 构建约 430s，verify 约 100s）。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: flutter pub get（含重试）
        run: |
          ok=0
          for i in 1 2 3; do
            if flutter pub get; then ok=1; break; fi
            echo "::warning::flutter pub get 第 ${i} 次失败，5s 后重试"
            sleep 5
          done
          [ "$ok" = 1 ]

      - run: flutter analyze
      - run: flutter test

  # APK 构建腿：与 ipa 并行（旧版 ipa needs apk，白等约 216s）。
  apk:
    runs-on: ubuntu-latest
    # 实测 build apk 约 430s（含 Gradle 依赖下载/NDK/CMake 安装），40 分钟给足首构建余量。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      # Gradle 用户home缓存（依赖 + wrapper）：旧版每轮从零下载，实测 Gradle 任务 427.7s 里
      # 有相当一段是依赖解析/下载。key 覆盖 android 构建脚本与 pubspec.lock（依赖覆盖路径包也变）。
      - name: 缓存 Gradle 依赖与 wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/build.gradle.kts', 'android/app/build.gradle.kts', 'android/settings.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: flutter pub get（含重试）
        run: |
          ok=0
          for i in 1 2 3; do
            if flutter pub get; then ok=1; break; fi
            echo "::warning::flutter pub get 第 ${i} 次失败，5s 后重试"
            sleep 5
          done
          [ "$ok" = 1 ]

      # 签名密钥来自 repo secrets；未配置则跳过，构建回退 debug 签名
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/zremote-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=zremote\nstoreFile=zremote-release.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
          fi

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: zremote-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          # 产物缺失即红：旧版默认 warn，可能带着空资产去建 Release。
          if-no-files-found: error

  # iOS 出未签名 IPA：无 Apple 开发者账号也可分发，用户自行签名侧载。
  ipa:
    # 必须 arm64 的 macos-latest：device_info_plus 13.3.0 的 isiOSAppOnVision
    # 依赖 iOS 26.1 SDK（Xcode 26），Intel 镜像编译失败。容量紧张时若拿不到运行器需重试。
    # 2026-11-17：容量取消不拖红发行——ipa 失败/取消时 publish 仍用 apk+hap 建 Release
    # （iOS 资产为可选），与主 ci 的 80ac76c 拆分精神一致。
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: flutter pub get（含重试）
        run: |
          ok=0
          for i in 1 2 3; do
            if flutter pub get; then ok=1; break; fi
            echo "::warning::flutter pub get 第 ${i} 次失败，5s 后重试"
            sleep 5
          done
          [ "$ok" = 1 ]

      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ios/iphoneos/Runner.app build/Payload/Runner.app
          ditto -c -k --keepParent build/Payload zremote-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: zremote-ios-unsigned-ipa
          path: zremote-ios-unsigned.ipa
          if-no-files-found: error

  # 鸿蒙包构建腿（开发计划 20261116-1434 P5）：与 apk/ipa 并行。
  # 工具链与 ohos.yml 同口径；产出「发布签名的 .app」——AGC 上架/内测的可安装形态。
  # 注意：.app 是华为应用包（含 entry-default.hap + pack.info + pac.json），双 ABI
  # （arm64 真机 + x86_64 模拟器）合体在一个 hap 内；AGC 只认 .app 且必须发布签名。
  # 之前发未签名 hap 只能模拟器装，真机装不了——本腿改为签名 .app（2026-11-17）。
  hap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 与 ohos.yml 同口径：stock 引擎 stamp/产物走中国镜像（OH 镜像会让
    # engine_stamp.json 404）；FLUTTER_OH_VERSION 锁 tag 防分叉升级漂移。
    # 必须放 job 级：pub get / 首轮 build / 二次 build 都要用；旧版只写在
    # 「准备 Flutter-OH SDK」step 级 env，后续步骤拿不到 → 首轮 build 404。
    env:
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      FLUTTER_OH_VERSION: 3.41.10-ohos-1.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 完整 HarmonyOS 命令行工具 + SDK（与 ohos.yml 同口径，本机验证过布局）
      - name: 安装 HarmonyOS 命令行工具 + SDK
        run: |
          set -e
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
                 -o /tmp/cmdtools.zip \
                 https://image.cdn.dog/commandline-tools-linux-x64-6.1.1.280.zip \
               && unzip -tq /tmp/cmdtools.zip >/dev/null; then
              ok=1; break
            fi
            echo "::warning::工具链下载/校验第 ${i} 次失败，10s 后重试"
            rm -f /tmp/cmdtools.zip
            sleep 10
          done
          [ "$ok" = 1 ]
          unzip -q /tmp/cmdtools.zip -d "$HOME/ohos-tools"
          TOOLS="$HOME/ohos-tools/command-line-tools"
          echo "HOS_SDK_HOME=$TOOLS/sdk" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$TOOLS/sdk" >> "$GITHUB_ENV"
          echo "PATH=$TOOLS/bin:$TOOLS/ohpm/bin:$TOOLS/sdk/default/openharmony/toolchains:$PATH" >> "$GITHUB_ENV"
          chmod +x "$TOOLS/bin"/* 2>/dev/null || true

      - name: 准备 Flutter-OH SDK（锁 tag）
        run: |
          # gitcode 偶发断流（同 L34 的下载污染类），克隆重试 3 次再判红
          ok=0
          for i in 1 2 3; do
            if git clone --depth 1 --branch "${FLUTTER_OH_VERSION}" \
                 https://gitcode.com/CPF-Flutter/flutter_flutter.git "$HOME/flutter_oh"; then
              ok=1; break
            fi
            echo "::warning::Flutter-OH 克隆第 ${i} 次失败，10s 后重试"
            rm -rf "$HOME/flutter_oh"
            sleep 10
          done
          [ "$ok" = 1 ]
          echo "$HOME/flutter_oh/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH 对本 step 不生效——用绝对路径完成首轮初始化
          "$HOME/flutter_oh/bin/flutter" --version
          "$HOME/flutter_oh/bin/flutter" config --ohos-sdk "$HOS_SDK_HOME"
          "$HOME/flutter_oh/bin/flutter" doctor | grep -i -A4 "HarmonyOS" || true

      - name: flutter pub get（含重试）
        run: |
          ok=0
          for i in 1 2 3; do
            if flutter pub get; then ok=1; break; fi
            echo "::warning::flutter pub get 第 ${i} 次失败，5s 后重试"
            sleep 5
          done
          [ "$ok" = 1 ]

      # @ohos/flutter_ohos 由首轮 build 的 FlutterTask 注入，故先容忍失败生成
      # oh_modules，再打 Autofill 补丁，二次 build 复用（详见 ohos.yml 同段注释）。
      - name: 首轮 build（注入 oh_modules，容忍 Autofill 编译失败）
        continue-on-error: true
        run: flutter build app --release --no-codesign

      - name: Patch OH embedder Autofill types
        run: python3 tool/patch_ohos_autofill.py

      # flutter build app 内部走 hvigor assembleApp，产出双 ABI 三件套 .app（含 arm64 + x86_64）。
      # 产物目录随 Flutter-OH 版本不同（实测 2026-11-17：build/ohos/app/），故用 find 定位。
      - name: 构建未签名 .app（双 ABI）
        run: flutter build app --release --no-codesign

      # 用 HOS 发布证书 + 发布 Profile 对 .app 整体签名（本机 verify success 同款）。
      # 密钥材料来自 secrets；缺失时降级为未签名 hap 腿（保留可构建验证，但真机不可用）。
      - name: 签名 .app（发布证书 + 发布 Profile）
        env:
          OHOS_KEYSTORE_BASE64: ${{ secrets.OHOS_KEYSTORE_BASE64 }}
          OHOS_CERT_BASE64: ${{ secrets.OHOS_CERT_BASE64 }}
          OHOS_PROFILE_BASE64: ${{ secrets.OHOS_PROFILE_BASE64 }}
          OHOS_KEYSTORE_PASSWORD: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
        run: |
          set -e
          UNSIGNED=$(find build/ohos -name 'ohos-default-unsigned.app' | head -1)
          [ -n "$UNSIGNED" ] || { echo "::error::未找到 ohos-default-unsigned.app"; exit 1; }
          OUT_DIR=$(dirname "$UNSIGNED")
          if [ -z "$OHOS_KEYSTORE_BASE64" ] || [ -z "$OHOS_CERT_BASE64" ] || \
             [ -z "$OHOS_PROFILE_BASE64" ] || [ -z "$OHOS_KEYSTORE_PASSWORD" ]; then
            echo "::warning::鸿蒙签名 secrets 未配齐，产出未签名 .app（真机不可装）"
            cp "$UNSIGNED" "$OUT_DIR/ZRemoteX-ohos-unsigned.app"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ohos-sign"
          echo "$OHOS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ohos-sign/app.p12"
          echo "$OHOS_CERT_BASE64"      | base64 -d > "$RUNNER_TEMP/ohos-sign/app.cer"
          echo "$OHOS_PROFILE_BASE64"   | base64 -d > "$RUNNER_TEMP/ohos-sign/app.p7b"
          SIGN_TOOL="$HOS_SDK_HOME/default/openharmony/toolchains/lib/hap-sign-tool.jar"
          java -jar "$SIGN_TOOL" sign-app -mode localSign \
            -keyAlias zremote-release -keyPwd "$OHOS_KEYSTORE_PASSWORD" \
            -appCertFile "$RUNNER_TEMP/ohos-sign/app.cer" \
            -profileFile "$RUNNER_TEMP/ohos-sign/app.p7b" \
            -inFile "$UNSIGNED" \
            -inForm zip -signAlg SHA256withECDSA \
            -keystoreFile "$RUNNER_TEMP/ohos-sign/app.p12" \
            -keystorePwd "$OHOS_KEYSTORE_PASSWORD" \
            -outFile "$OUT_DIR/ZRemoteX-ohos-signed.app" \
            -compatibleVersion 8 -signCode 1
          # 验签；失败即红（不放带病包出去）
          java -jar "$SIGN_TOOL" verify-app \
            -inFile "$OUT_DIR/ZRemoteX-ohos-signed.app" \
            -outCertChain "$RUNNER_TEMP/ohos-sign/vc.cer" \
            -outProfile "$RUNNER_TEMP/ohos-sign/vp.p7b"

      - uses: actions/upload-artifact@v4
        with:
          name: zremote-ohos-app
          path: build/ohos/**/ZRemoteX-ohos-*.app
          if-no-files-found: error

  # 统一建 Release：等 verify + apk + hap 全绿再建（2026-11-17 起 ipa 解耦——
  # macOS 运行器容量取消频发，iOS 资产改为可选，不阻塞 Android/鸿蒙发行）。
  # ipa 成功时其资产仍会被附上；取消/失败则本次 Release 无 iOS 资产，下次发行补上。
  publish:
    needs: [verify, apk, hap]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: zremote-apk
          path: artifacts/apk

      - name: 下载 IPA 产物（可选：ipa job 因容量取消时跳过）
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: zremote-ios-unsigned-ipa
          path: artifacts/ipa

      - name: 下载鸿蒙 app 产物
        uses: actions/download-artifact@v4
        with:
          name: zremote-ohos-app
          path: artifacts/ohos

      # 资产文件名带「应用名 + 版本 + 平台」：`app-release.apk` / `zremote-ios-unsigned.ipa`
      # 看不出是 ZRemoteX（上游同名），装机/分享时无法辨认（用户反馈）。
      - name: Rename assets（ZRemoteX + 版本 + 平台）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp artifacts/apk/app-release.apk "artifacts/apk/ZRemoteX-v${VERSION}-android.apk"
          # iOS 资产可选（ipa job 因 macOS 容量取消时不存在）。
          if [ -f artifacts/ipa/zremote-ios-unsigned.ipa ]; then
            cp artifacts/ipa/zremote-ios-unsigned.ipa "artifacts/ipa/ZRemoteX-v${VERSION}-ios-unsigned.ipa"
          else
            echo "::warning::本次无 iOS 资产（ipa job 未成功），Release 仅含 Android/鸿蒙"
          fi
          # 签名成功为 ZRemoteX-ohos-signed.app；secrets 缺失时为 ...unsigned.app
          OHOS_APP=$(ls artifacts/ohos/ZRemoteX-ohos-*.app | head -1)
          cp "$OHOS_APP" "artifacts/ohos/ZRemoteX-v${VERSION}-ohos.app"
          ls -la artifacts/apk artifacts/ipa artifacts/ohos

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # body 会前置到自动生成的发布说明之前（softprops/action-gh-release 文档），两者共存。
          body: |
            三个平台的安装包（文件名带应用名 + 版本 + 平台）：

            > **Android 包（`ZRemoteX-v<版本>-android.apk`）**：使用仓库配置的发布密钥签名，可直接安装；
            > 若仓库未配置 `KEYSTORE_BASE64`，则回退 debug 签名，可能无法覆盖本机已安装的正式签名版。
            >
            > **iOS 包（`ZRemoteX-v<版本>-ios-unsigned.ipa`，若存在）为未签名包，无法直接安装。**
            > 请使用 [AltStore](https://altstore.io) / [Sideloadly](https://sideloadly.io) / TrollStore 等工具，
            > 用自己的 Apple ID 签名后侧载（免费账号 7 天需重新签名）。
            > 若本次 Release 无 iOS 资产，是 macOS 运行器容量不足导致 iOS 构建取消（非代码问题），后续发行会补上。
            >
            > **鸿蒙包（`ZRemoteX-v<版本>-ohos.app`）**：华为应用包，双 ABI（arm64 真机 + x86_64 模拟器）合体，使用发布证书 + 发布 Profile 签名。
            > 用于 AGC 上架 / 内测分发；普通用户需通过应用市场/内测链接安装（鸿蒙 NEXT 不支持随意侧载）。若 secrets 未配齐则为未签名包，真机不可装。
          # 用 glob 而非变量：action 的 `with:` 输入不做 env 展开（只有 `run:` 里才展开）。
          files: |
            artifacts/apk/ZRemoteX-v*-android.apk
            artifacts/ipa/ZRemoteX-v*-ios-unsigned.ipa
            artifacts/ohos/ZRemoteX-v*-ohos.app
