name: ohos

# 鸿蒙（HarmonyOS NEXT）构建腿（开发计划 20261116-1434 P5）。
#
# 为什么单独一个 workflow 而不是塞进 ci.yml：
# Flutter-OH 是社区 SDK 分叉，工具链（OpenHarmony SDK + ohpm + hvigor + CPF
# flutter_flutter）在 runner 上的安装方式还在收敛，单独成腿可让既有
# analyze/test/ios 绿腿不被未稳定的 OH 工具链拖红；稳定后可折叠进 ci.yml。
#
# 触发：push main / PR / 手动（Actions 页 Run workflow）——即「允许推送触发」。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ohos-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # stock 引擎 stamp/产物走中国镜像（2026-11-16 实测：若设为 OH 镜像会导致
  # engine_stamp.json 404）；OH 引擎产物走分叉默认的 FLUTTER_OHOS_STORAGE_BASE_URL。
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
  # 锁到具体 tag，分叉升级期不随默认分支漂移
  FLUTTER_OH_VERSION: 3.41.10-ohos-1.0.1

# 工具链（2026-11-16 Windows 本机全链路实测）：需 **完整 HarmonyOS 命令行工具**
# （含 ohpm + hvigorw + SDK），不是裸 OpenHarmony SDK——后者缺 ohpm/hvigorw。
# 本机路径：D:\HuanJing\Huawei\command-line-tools（6.1.1.280），SDK 在其
# sdk/default/openharmony；`flutter config --ohos-sdk` 指向 sdk/default 的父级 sdk 目录。
# Linux runner 对应 commandline-tools-linux + ohsdkmgr（CPF FAQ），并设 HOS_SDK_HOME。
# 公开可跑样例：niuhuan/harmony-next-flutter-pipeline-docker（容器镜像）。
# 关键：CPF 3.41 嵌入层需打 Autofill 补丁（见下方步骤），否则 ArkTS 编译失败。
jobs:
  hap:
    runs-on: ubuntu-latest
    # 工具链首轮安装（SDK + ohpm + hvigor + Flutter-OH 引擎产物）较重，给足余量。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 完整 HarmonyOS 命令行工具（含 ohpm + hvigorw + SDK），本机 Windows 同款 Linux 版。
      # 必须整套而非裸 SDK：flutter build hap 硬依赖 ohpm install + hvigorw assembleHap。
      - name: 安装 HarmonyOS 命令行工具 + SDK
        run: |
          set -e
          curl -fsSL -o /tmp/cmdtools.zip \
            https://image.cdn.dog/commandline-tools-linux-x64-6.1.1.280.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/ohos-tools"
          TOOLS="$HOME/ohos-tools/command-line-tools"
          echo "TOOL_HOME=$TOOLS" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$TOOLS/sdk" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$TOOLS/sdk" >> "$GITHUB_ENV"
          echo "PATH=$TOOLS/bin:$TOOLS/ohpm/bin:$TOOLS/sdk/default/openharmony/toolchains:$PATH" >> "$GITHUB_ENV"
          chmod +x "$TOOLS/bin"/* 2>/dev/null || true

      - name: 准备 Flutter-OH SDK（锁 tag）
        run: |
          git clone --depth 1 --branch "${FLUTTER_OH_VERSION}" \
            https://gitcode.com/CPF-Flutter/flutter_flutter.git "$HOME/flutter_oh"
          echo "$HOME/flutter_oh/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH 对本 step 不生效——用绝对路径完成首轮初始化
          export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
          "$HOME/flutter_oh/bin/flutter" --version
          "$HOME/flutter_oh/bin/flutter" config --ohos-sdk "$HOS_SDK_HOME"
          "$HOME/flutter_oh/bin/flutter" doctor | grep -i -A4 "HarmonyOS" || true

      - name: flutter pub get（含重试）
        run: |
          ok=0
          for i in 1 2 3; do
            if flutter pub get; then ok=1; break; fi
            echo "::warning::flutter pub get 第 ${i} 次失败，5s 后重试"
            sleep 5
          done
          [ "$ok" = 1 ]

      # CPF-Flutter 3.41 嵌入层 OhosAutoFillHelper 引用了公开 SDK 未导出的
      # autoFillManager 类型（15 个 ArkTS 编译错误）——用本地脚本降级为 any
      # （Autofill 在 api<26 运行时短路，不改真机行为）。上游修复后可移除。
      # ohpm install 由 flutter build hap 内部触发，但补丁须在 ArkTS 编译前打；
      # 故先手动 ohpm install 生成 oh_modules，再打补丁（幂等，build 时不会重下嵌入层）。
      - name: Patch OH embedder Autofill types
        run: |
          (cd ohos && ohpm install --all)
          python3 tool/patch_ohos_autofill.py

      # 未签名 hap：本机/CI 只验证「可构建」；签名作为 P6 子项（需华为签名证书）。
      - run: flutter build hap --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: zremote-ohos-hap
          path: build/ohos/hap/entry-default-unsigned.hap
          if-no-files-found: error
