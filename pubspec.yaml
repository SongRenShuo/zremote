name: zremote
description: "ZRemote — ZCode 桌面端远程控制伴侣 App：扫码导入，多设备并行会话，生物识别门禁。"
publish_to: 'none'

version: 2.2.1+18

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 鸿蒙适配（车道 B）：换用 CPF-Flutter 社区 ohos fork（含 ohos 平台实现）。
  # ref 均经 git ls-remote 核实（2026-11-16）；Android/iOS 行为保持不变。
  # inappwebview 主包保留 stock hosted（与本地 MULTI_PROFILE platform_interface
  # fork 兼容；CPF 主包新增的 dispose() 调用本地接口没有，stock SDK 测试编译
  # 会挂），仅追加 flutter_inappwebview_ohos 实现子包注册 ohos 平台。
  flutter_inappwebview: ^6.1.5
  # ohos 实现子包 vendor 化到 third_party（同 file_picker：pub git 缓存
  # 绝对路径会被 hvigor 00303231 拒绝——旧架构 ohos 平台包需相对 srcPath）。
  flutter_inappwebview_ohos:
    path: third_party/flutter_inappwebview_ohos
  # mobile_scanner 暂保留 stock hosted：CPF fork lib 内使用 Flutter-OH 专有的
  # TargetPlatform.ohos（lib/src/method_channel/mobile_scanner_method_channel.dart
  # 3 处），stock SDK 下整个 app 编译失败（连 Android 一起挂），宁缺毋滥。
  mobile_scanner: ^7.4.0
  flutter_secure_storage:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_flutter_secure_storage.git
      path: flutter_secure_storage
      ref: 9.2.4-ohos-1.0.0
  # flutter_secure_storage 主包（9.2.4-ohos-1.0.0）未把 ohos 实现列为
  # default_package，需显式引入实现包注册 ohos 平台。
  # 同上 vendor 化（旧架构 ohos 平台包，git 缓存绝对路径 hvigor 不收）。
  flutter_secure_storage_ohos:
    path: third_party/flutter_secure_storage_ohos
  local_auth:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/local_auth/local_auth
      ref: br_local_auth-v3.0.1_ohos
  flutter_riverpod: ^3.3.2
  shared_preferences:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.4_ohos
  # 主包自带 ohos/ 平台工程（旧架构），vendor 化避免 pub git 缓存绝对
  # 路径被 hvigor 00303231 拒绝（share_plus 与各 *_ohos 子包同理）。
  package_info_plus:
    path: third_party/package_info_plus
  uuid: ^4.6.0
  # flutter_local_notifications 暂保留 stock hosted：CPF fork（22.0.1-ohos tag
  # 与 19.5.0 均同）lib 内 9 处 TargetPlatform.ohos（Flutter-OH 专有），stock
  # SDK 下整个 app 编译失败；鸿蒙通知通道待 Flutter-OH 统一构建时评估。
  flutter_local_notifications: ^22.3.0
  url_launcher:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/url_launcher/url_launcher
      ref: br_url_launcher-v6.3.2_ohos
  intl: ^0.20.2

  # V2.0 新增（开发计划 20261115-0901 P5-5 统一落位）
  dio: ^5.7.0
  cryptography: ^2.7.0
  share_plus:
    path: third_party/share_plus
  path_provider:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos
  # file_picker 全平台统一 stock hosted（11.x，兼容 win32 ^5 生态）。
  # 曾评估 13.x：其 windows_file_picker 链要 win32 ^6，与 share_plus/
  # secure_storage fork（锁 ^5）冲突；ohos 侧 .zsb 导入暂降级（调用处
  # catch 提示），导出不受影响。
  file_picker: ^11.0.3
  # device_info_plus 暂保留 stock hosted：CPF fork 主包 lib 内联 ohos 实现
  # 且使用 Flutter-OH 专有的 Platform.isOhos，stock SDK 下测试编译失败
  # （宁缺毋滥，见车道 B 适配对照表「风险」列）。
  device_info_plus: ">=11.0.0 <14.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  # MULTI_PROFILE 特性 fork（Android 多 WebView 配置文件语义）：
  # 保留本地 fork，覆盖 CPF inappwebview fork 自带的同名子包。
  # CPF 主包同为 6.1.5 基线，与本 platform_interface（1.3.0+1 + 特性）兼容。
  flutter_inappwebview_platform_interface:
    path: third_party/flutter_inappwebview_platform_interface
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android
  # CPF fork 的 ohos 平台子包由主包 default_package 自动拉取（pub git 缓存
  # 绝对路径 hvigor 不收），用 overrides 改指向仓库内 vendor 副本。
  shared_preferences_ohos:
    path: third_party/shared_preferences_ohos
  path_provider_ohos:
    path: third_party/path_provider_ohos
  url_launcher_ohos:
    path: third_party/url_launcher_ohos
  local_auth_ohos:
    path: third_party/local_auth_ohos
  # share_plus_platform_interface（CPF fork）内部依赖 path_provider 指向
  # openharmony-sig/flutter_packages master；统一覆盖为 CPF fork 分支，
  # 避免同一包双 git 源版本冲突。
  path_provider:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos
  # local_auth_ohos（CPF fork）锁 intl <0.19.0，但其 Dart 侧仅用
  # Intl.message 稳定 API；本仓与 flutter_localizations 需要 intl 0.20.x，
  # 统一覆盖为 0.20.2。
  intl: 0.20.2

flutter:

  uses-material-design: true

  generate: true

  assets:
    - assets/brand/mark.png
    - assets/fonts/OFL.txt

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
